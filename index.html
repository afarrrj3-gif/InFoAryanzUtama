<style>
:root{
  --blue:#6fbce8;
  --blue-soft:#cfe9f9;
  --bg:#f7fbff;
  --text:#1f2d3d;
  --muted:#6b7c93;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== BANNER ===== */
.banner{
  height:260px;
  position:relative;
  background:
    linear-gradient(
      to bottom,
      rgba(111,188,232,.25),
      rgba(255,255,255,.85) 70%,
      #fff
    ),
    url("https://res.cloudinary.com/dtdodhqqi/image/upload/v1766772767/IMG-20251128-WA0091_ldbe9l.jpg");
  background-size:cover;
  background-position:center;
}

.banner::after{
  content:'';
  position:absolute;
  inset:0;
  backdrop-filter:blur(2px);
}

.logo{
  position:absolute;
  bottom:-55px;
  left:50%;
  transform:translateX(-50%);
  width:110px;
  height:110px;
  background:#fff;
  padding:10px;
  border-radius:50%;
  box-shadow:0 20px 40px rgba(0,0,0,.18);
  z-index:2;
}

.logo img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

/* ===== CONTENT ===== */
.container{
  max-width:420px;
  margin:auto;
  padding:80px 20px 40px;
}

.header{
  text-align:center;
  animation:fadeUp .8s ease;
}

@keyframes fadeUp{
  from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.header h1{
  margin-bottom:6px;
  font-size:22px;
}

.header p{
  font-size:14px;
  color:var(--muted);
  margin-bottom:35px;
}

/* ===== GROUP ===== */
.group{
  margin-bottom:30px;
}

.group-title{
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  color:#4f8fb8;
  margin-bottom:12px;
}

/* ===== LINK CARD ===== */
.link{
  display:block;
  padding:16px;
  background:#fff;
  border-radius:16px;
  text-decoration:none;
  color:var(--text);
  font-weight:600;
  box-shadow:0 10px 28px rgba(0,0,0,.08);
  margin-bottom:14px;
  transition:.35s;
  animation:fadeUp .6s ease;
}

.link span{
  display:block;
  font-size:12px;
  font-weight:400;
  color:var(--muted);
  margin-top:4px;
}

.link:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 45px rgba(0,0,0,.16);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  font-size:12px;
  color:#8a94a6;
  margin-top:40px;
}
</style>
</head>
